name: refresh-telemetry

on:
  schedule:
    - cron: "17 */6 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "data/status.json"
      - "scripts/**"
      - ".github/workflows/telemetry.yml"

permissions:
  contents: write

concurrency:
  group: profile-telemetry
  cancel-in-progress: true

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Collect public GitHub activity
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: >-
          python scripts/github_activity.py
          --username "${{ github.repository_owner }}"
          --status data/status.json
          --output data/activity.json

      - name: Render telemetry assets
        run: |
          python scripts/generate_telemetry.py
          python scripts/generate_pulse.py
          python scripts/generate_timeline.py
          python scripts/generate_matrix.py

      - name: Commit changed telemetry
        shell: bash
        run: |
          if git diff --quiet -- assets data/activity.json; then
            echo "Telemetry is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets data/activity.json
          git commit -m "chore: refresh developer telemetry"
          git push

