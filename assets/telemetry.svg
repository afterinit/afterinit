<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="620" viewBox="0 0 1200 620" role="img" aria-labelledby="title desc">
  <title id="title">loolc.com — a line-drawn identity for afterinit</title>
  <desc id="desc">A two-dimensional custom LOOLC wordmark on a warm paper background. Its statement is Let Our Originality Lead Creation. Latest public push: afinit_blog_page on master, 5 days ago.</desc>
  <defs>
    <pattern id="paper-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#AFA89B" stroke-width="0.5" opacity="0.13" />
    </pattern>
    <style>
      .sans { font-family: Arial, Helvetica, sans-serif; }
      .mono { font-family: Consolas, 'Liberation Mono', monospace; }
      .outline { fill: none; stroke: #171715; stroke-width: 3; stroke-linecap: square; stroke-linejoin: miter; }
      .fine { fill: none; stroke: #777166; stroke-width: 1.2; }
      .guide { fill: none; stroke: #CEC8BC; stroke-width: 1; }
      .label { fill: #171715; font-size: 10px; font-weight: 700; letter-spacing: 1.8px; }
      .meta { fill: #777166; font-size: 10px; letter-spacing: 0.65px; }
      .domain { fill: #171715; font-size: 22px; font-weight: 700; letter-spacing: -0.6px; }
      .locate-scan { animation: locate-scan 5.6s ease-in-out infinite; }
      .locate-pulse { animation: locate-pulse 4.2s ease-out infinite; transform-origin: 97px 164px; }
      .observe-flow { animation: observe-flow 5.6s linear infinite; }
      .orbit-dot { animation: orbit 12s linear infinite; transform-origin: 355px 286px; }
      .organize-ring { animation: organize-spin 24s linear infinite; transform-origin: 600px 286px; }
      .organize-ring-reverse { animation: organize-spin-reverse 16s linear infinite; transform-origin: 600px 286px; }
      .origin { animation: pulse 3.8s ease-in-out infinite; }
      .link-signal { animation: link-signal 5.2s linear infinite; }
      .link-source-pulse { animation: link-pulse 4.2s ease-out infinite; transform-origin: 773px 184px; }
      .link-target-pulse { animation: link-pulse 4.2s ease-out -2.1s infinite; transform-origin: 886px 381px; }
      .create-trace { animation: create-trace 8s linear infinite; }
      .create-tip { animation: create-tip 4s ease-in-out infinite; transform-origin: 1130px 207px; }
      .create-end-pulse { animation: create-end-pulse 4s ease-out infinite; transform-origin: 1114px 365px; }
      .create-spark { animation: create-spark 14s linear infinite; transform-origin: 1025px 286px; }
      .create-core { animation: create-core 3.4s ease-in-out infinite; transform-origin: 1025px 286px; }
      .mini-locate-pulse { animation: mini-pulse 4.4s ease-out infinite; transform-origin: 370px 53px; }
      .mini-observe-dot { animation: mini-orbit 8s linear infinite; }
      .mini-organize-ring { animation: mini-spin 12s linear infinite; transform-origin: 750px 53px; }
      .mini-organize-core { animation: mini-core 3.2s ease-in-out infinite; transform-origin: 750px 53px; }
      .mini-link-flow { animation: mini-flow 3.6s linear infinite; }
      .mini-create-flight { animation: mini-create-journey 6s linear -5.1s infinite; transform: translate(1122px, 37px) rotate(-143.13deg); transform-origin: 0 0; }
      .mini-create-exhaust { animation: mini-create-exhaust 6s linear -5.1s infinite; opacity: 0; }
      @keyframes locate-scan {
        0%, 12% { opacity: 0; transform: translateY(0); }
        24%, 74% { opacity: 0.72; }
        88%, 100% { opacity: 0; transform: translateY(158px); }
      }
      @keyframes locate-pulse {
        0% { opacity: 0.55; transform: scale(0.55); }
        70%, 100% { opacity: 0; transform: scale(1.65); }
      }
      @keyframes observe-flow { to { stroke-dashoffset: -86; } }
      @keyframes orbit { to { transform: rotate(360deg); } }
      @keyframes organize-spin {
        from { transform: rotate(-28deg); }
        to { transform: rotate(332deg); }
      }
      @keyframes organize-spin-reverse { to { transform: rotate(-360deg); } }
      @keyframes pulse {
        0%, 100% { opacity: 0.35; transform: scale(0.78); transform-origin: 600px 286px; }
        50% { opacity: 1; transform: scale(1); transform-origin: 600px 286px; }
      }
      @keyframes link-signal { to { stroke-dashoffset: -64; } }
      @keyframes link-pulse {
        0% { opacity: 0.55; transform: scale(0.45); }
        72%, 100% { opacity: 0; transform: scale(1.75); }
      }
      @keyframes create-trace { to { stroke-dashoffset: -802; } }
      @keyframes create-tip {
        0%, 100% { opacity: 0.78; transform: scale(0.96); }
        50% { opacity: 1; transform: scale(1.04); }
      }
      @keyframes create-end-pulse {
        0% { opacity: 0.52; transform: scale(0.55); }
        72%, 100% { opacity: 0; transform: scale(1.7); }
      }
      @keyframes create-spark { to { transform: rotate(360deg); } }
      @keyframes create-core {
        0%, 100% { opacity: 0.55; transform: scale(0.78); }
        50% { opacity: 1; transform: scale(1.08); }
      }
      @keyframes mini-pulse {
        0% { opacity: 0.5; transform: scale(0.55); }
        72%, 100% { opacity: 0; transform: scale(1.55); }
      }
      @keyframes mini-orbit {
        0%, 100% { transform: translate(0, 0); }
        6.25% { transform: translate(-0.99px, 4.27px); }
        12.5% { transform: translate(-5.93px, 9.06px); }
        18.75% { transform: translate(-14.07px, 13.65px); }
        25% { transform: translate(-24.16px, 17.33px); }
        31.25% { transform: translate(-34.67px, 19.55px); }
        37.5% { transform: translate(-44px, 19.97px); }
        43.75% { transform: translate(-50.73px, 18.53px); }
        50% { transform: translate(-53.83px, 15.44px); }
        56.25% { transform: translate(-52.84px, 11.17px); }
        62.5% { transform: translate(-47.9px, 6.38px); }
        68.75% { transform: translate(-39.76px, 1.79px); }
        75% { transform: translate(-29.67px, -1.89px); }
        81.25% { transform: translate(-19.16px, -4.12px); }
        87.5% { transform: translate(-9.83px, -4.54px); }
        93.75% { transform: translate(-3.1px, -3.09px); }
      }
      @keyframes mini-spin { to { transform: rotate(360deg); } }
      @keyframes mini-core {
        0%, 100% { opacity: 0.55; transform: scale(0.8); }
        50% { opacity: 1; transform: scale(1); }
      }
      @keyframes mini-flow { to { stroke-dashoffset: -56; } }
      @keyframes mini-create-journey {
        0% { transform: translate(1122px, 37px) rotate(-143.13deg); }
        6% { transform: translate(1115.42px, 33.75px) rotate(-164.28deg); }
        12% { transform: translate(1108.11px, 33.09px) rotate(-185.42deg); }
        18% { transform: translate(1101.06px, 35.11px) rotate(-206.57deg); }
        24% { transform: translate(1095.21px, 39.54px) rotate(-227.71deg); }
        30% { transform: translate(1091.35px, 45.79px) rotate(-248.86deg); }
        36% { transform: translate(1090px, 53px) rotate(-270deg); }
        42% { transform: translate(1091.35px, 60.21px) rotate(-291.14deg); }
        48% { transform: translate(1095.21px, 66.46px) rotate(-312.29deg); }
        54% { transform: translate(1101.06px, 70.89px) rotate(-333.43deg); }
        60% { transform: translate(1108.11px, 72.91px) rotate(-354.58deg); }
        66% { transform: translate(1115.42px, 72.25px) rotate(-375.72deg); }
        72% { transform: translate(1122px, 69px) rotate(-396.87deg); }
        76% { transform: translate(1122px, 69px) rotate(-396.87deg) scale(0.72); }
        80% { transform: translate(1122px, 69px) rotate(-396.87deg) scale(1.08); }
        83.33% { transform: translate(1126.3px, 64.59px) rotate(-414.58deg); }
        86.67% { transform: translate(1129.05px, 59.08px) rotate(-432.29deg); }
        90% { transform: translate(1130px, 53px) rotate(-450deg); }
        93.33% { transform: translate(1129.05px, 46.92px) rotate(-467.71deg); }
        96.67% { transform: translate(1126.3px, 41.41px) rotate(-485.42deg); }
        100% { transform: translate(1122px, 37px) rotate(-503.13deg); }
      }
      @keyframes mini-create-exhaust {
        0%, 79.9%, 100% { opacity: 0; }
        82% { opacity: 0.38; }
        85% { opacity: 0.95; }
        88% { opacity: 0.42; }
        91% { opacity: 0.86; }
        94% { opacity: 0.32; }
        97% { opacity: 0.76; }
        99% { opacity: 0.18; }
      }
      @media (prefers-reduced-motion: reduce) {
        .locate-scan, .locate-pulse, .observe-flow, .orbit-dot, .organize-ring, .organize-ring-reverse,
        .origin, .link-signal, .link-source-pulse, .link-target-pulse, .create-trace,
        .create-tip, .create-end-pulse, .create-spark, .create-core, .mini-locate-pulse,
        .mini-observe-dot, .mini-organize-ring, .mini-organize-core, .mini-link-flow,
        .mini-create-flight, .mini-create-exhaust { animation: none; }
        .locate-scan, .locate-pulse, .link-source-pulse, .link-target-pulse,
        .create-end-pulse, .mini-locate-pulse, .mini-create-exhaust { opacity: 0; }
        .link-signal, .create-trace { stroke-dashoffset: 0; opacity: 0.7; }
      }
    </style>
  </defs>

  <rect width="1200" height="620" fill="#F2EFE7" />
  <rect width="1200" height="620" fill="url(#paper-grid)" />

  <text class="sans domain" x="58" y="61">loolc<tspan fill="#F05032">.com</tspan></text>

  <!-- A compact index carries the five ideas into the header without adding copy. -->
  <g id="header-sequence" aria-label="LOOLC visual index">
    <line x1="334" y1="53" x2="1142" y2="53" stroke="#CEC8BC" />

    <g aria-label="Locate symbol">
      <line x1="370" y1="34" x2="370" y2="72" stroke="#777166" stroke-width="1" />
      <line x1="361" y1="41" x2="370" y2="41" stroke="#777166" stroke-width="1" />
      <line x1="364" y1="65" x2="370" y2="65" stroke="#777166" stroke-width="1" />
      <circle cx="370" cy="53" r="5" fill="#F05032" />
      <circle class="mini-locate-pulse" cx="370" cy="53" r="8" fill="none" stroke="#F05032" stroke-width="1" />
    </g>

    <g aria-label="Observe symbol">
      <ellipse cx="555" cy="53" rx="28" ry="10" transform="rotate(-16 555 53)" fill="none" stroke="#777166" stroke-width="1" />
      <g class="mini-observe-ellipse">
        <g class="mini-observe-dot">
          <circle cx="581.92" cy="45.28" r="4" fill="#F05032" />
        </g>
      </g>
    </g>

    <g aria-label="Organize symbol">
      <circle class="mini-organize-ring" cx="750" cy="53" r="15" fill="#F2EFE7" stroke="#171715" stroke-width="1.2" stroke-dasharray="72 7" />
      <line x1="731" y1="53" x2="769" y2="53" stroke="#777166" stroke-width="1" />
      <line x1="750" y1="34" x2="750" y2="72" stroke="#777166" stroke-width="1" />
      <circle class="mini-organize-core" cx="750" cy="53" r="5" fill="#3155C6" />
    </g>

    <g aria-label="Link symbol">
      <path class="mini-link-flow" d="M938 30V59Q938 67 946 67H962" fill="none" stroke="#3155C6" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="6 8" />
      <circle cx="938" cy="30" r="4" fill="#F05032" />
      <circle cx="962" cy="67" r="4" fill="#3155C6" />
    </g>

    <g aria-label="Create symbol">
      <path d="M1122 37A20 20 0 1 0 1122 69" fill="none" stroke="#171715" stroke-width="1.2" />
      <path class="mini-create-return" d="M1122 69A20 20 0 0 0 1122 37" fill="none" stroke="#3155C6" stroke-width="1" stroke-linecap="round" stroke-dasharray="3 5" opacity="0.75" />
      <g class="mini-create-flight">
        <g class="mini-create-exhaust" fill="none" stroke-linecap="round">
          <path d="M-5 -2H-9" stroke="#3155C6" stroke-width="0.8" />
          <path d="M-5 0H-12" stroke="#F05032" stroke-width="1.4" />
          <path d="M-5 2H-9" stroke="#3155C6" stroke-width="0.8" />
        </g>
        <path class="mini-create-arrow" d="M-3 -3L4 0L-3 3Z" fill="#F05032" />
      </g>
    </g>
  </g>

  <line x1="58" y1="108" x2="1142" y2="108" stroke="#171715" stroke-width="1" />
  <line x1="58" y1="112" x2="266" y2="112" stroke="#F05032" stroke-width="3" />

  <g id="loolc-linework">
    <!-- L / LOCATE: a measured stroke finds the idea's starting point. -->
    <g aria-label="L — locate">
      <path class="outline" d="M68 164H126V352H230V410H68Z" />
      <line class="fine" x1="52" y1="194" x2="68" y2="194" />
      <line class="fine" x1="58" y1="224" x2="68" y2="224" />
      <line class="fine" x1="52" y1="254" x2="68" y2="254" />
      <line class="fine" x1="58" y1="284" x2="68" y2="284" />
      <line class="fine" x1="52" y1="314" x2="68" y2="314" />
      <line class="fine" x1="58" y1="344" x2="68" y2="344" />
      <line class="locate-scan" x1="77" y1="190" x2="117" y2="190" stroke="#3155C6" stroke-width="2" opacity="0" />
      <circle cx="97" cy="164" r="8" fill="#F05032" />
      <circle class="locate-pulse" cx="97" cy="164" r="13" fill="none" stroke="#F05032" stroke-width="1.2" />
      <line x1="97" y1="146" x2="97" y2="182" stroke="#F05032" stroke-width="1" />
      <text class="mono label" x="149" y="448" text-anchor="middle">LOCATE</text>
    </g>

    <!-- O / OBSERVE: a moving point studies the form from every angle. -->
    <g aria-label="O — observe">
      <circle class="outline" cx="355" cy="286" r="122" />
      <circle class="outline" cx="355" cy="286" r="67" />
      <ellipse class="fine" cx="355" cy="286" rx="145" ry="45" transform="rotate(-18 355 286)" opacity="0.35" />
      <ellipse class="observe-flow" cx="355" cy="286" rx="145" ry="45" transform="rotate(-18 355 286)" fill="none" stroke="#777166" stroke-width="1.5" stroke-linecap="round" stroke-dasharray="38 16 7 16" />
      <g class="orbit-dot">
        <circle cx="494" cy="244" r="8" fill="#F05032" />
        <circle cx="494" cy="244" r="13" fill="none" stroke="#F05032" stroke-width="1" opacity="0.45" />
      </g>
      <text class="mono label" x="355" y="448" text-anchor="middle">OBSERVE</text>
    </g>

    <!-- O / ORGANIZE: axes and a structured ring order the information. -->
    <g aria-label="O — organize">
      <circle class="outline organize-ring" cx="600" cy="286" r="122" stroke-dasharray="492 18" />
      <circle class="outline organize-ring-reverse" cx="600" cy="286" r="67" stroke-dasharray="15 9" />
      <line class="fine" x1="557" y1="286" x2="643" y2="286" />
      <line class="fine" x1="600" y1="243" x2="600" y2="329" />
      <path d="M681 195L600 286L526 372" fill="none" stroke="#3155C6" stroke-width="1.5" />
      <circle class="origin" cx="600" cy="286" r="9" fill="#3155C6" />
      <circle cx="600" cy="286" r="18" fill="none" stroke="#3155C6" stroke-width="1" opacity="0.35" />
      <text class="mono label" x="600" y="448" text-anchor="middle">ORGANIZE</text>
    </g>

    <!-- L / LINK: one continuous signal travels from source to destination. -->
    <g aria-label="L — link">
      <path class="outline" d="M744 164H802V352H906V410H744Z" />
      <path d="M773 184V381H886" fill="none" stroke="#777166" stroke-width="1.2" opacity="0.45" />
      <path class="link-signal" d="M773 184V381H886" fill="none" stroke="#3155C6" stroke-width="2" stroke-linecap="square" stroke-linejoin="miter" stroke-dasharray="8 12" />
      <circle cx="773" cy="184" r="6" fill="#F05032" />
      <circle class="link-source-pulse" cx="773" cy="184" r="12" fill="none" stroke="#F05032" stroke-width="1.2" />
      <circle cx="886" cy="381" r="6" fill="#3155C6" />
      <circle class="link-target-pulse" cx="886" cy="381" r="12" fill="none" stroke="#3155C6" stroke-width="1.2" />
      <text class="mono label" x="825" y="448" text-anchor="middle">LINK</text>
    </g>

    <!-- C / CREATE: a restrained tracer stays on the letter's original open form. -->
    <g aria-label="C — create">
      <path class="outline" d="M1114 207A116 116 0 1 0 1114 365" />
      <path class="outline" d="M1075 245A64 64 0 1 0 1075 327" />
      <line class="outline" x1="1114" y1="207" x2="1075" y2="245" />
      <line class="outline" x1="1114" y1="365" x2="1075" y2="327" />
      <path class="create-trace" d="M1114 207A116 116 0 1 0 1114 365" fill="none" stroke="#F05032" stroke-width="2.5" stroke-linecap="round" stroke-dasharray="28 774" />
      <path class="create-tip" d="M1122 193L1145 207L1118 216Z" fill="#F05032" />
      <circle cx="1114" cy="365" r="6" fill="#F05032" />
      <circle class="create-end-pulse" cx="1114" cy="365" r="12" fill="none" stroke="#F05032" stroke-width="1.2" />
      <g class="create-spark" aria-label="creation spark">
        <line x1="1025" y1="258" x2="1025" y2="272" stroke="#3155C6" stroke-width="1.5" />
        <line x1="1025" y1="300" x2="1025" y2="314" stroke="#F05032" stroke-width="1.5" />
        <line x1="997" y1="286" x2="1011" y2="286" stroke="#F05032" stroke-width="1.5" />
        <line x1="1039" y1="286" x2="1053" y2="286" stroke="#3155C6" stroke-width="1.5" />
        <line x1="1007" y1="268" x2="1016" y2="277" stroke="#777166" stroke-width="1" />
        <line x1="1034" y1="295" x2="1043" y2="304" stroke="#777166" stroke-width="1" />
      </g>
      <path class="create-core" d="M1025 274L1029 282L1037 286L1029 290L1025 298L1021 290L1013 286L1021 282Z" fill="none" stroke="#F05032" stroke-width="1.8" stroke-linejoin="round" />
      <circle cx="1025" cy="286" r="3.5" fill="#3155C6" />
      <text class="mono label" x="1030" y="448" text-anchor="middle">CREATE</text>
    </g>
  </g>

  <line x1="58" y1="480" x2="1142" y2="480" stroke="#CEC8BC" />
  <text class="sans" x="58" y="526" fill="#171715" font-size="28" font-weight="400" letter-spacing="-0.7">Let Our Originality Lead Creation.</text>

  <line x1="58" y1="554" x2="1142" y2="554" stroke="#171715" stroke-width="1" />
  <text class="mono meta" x="58" y="584">afterinit</text>
  <text class="mono meta" x="1142" y="584" text-anchor="end">2026</text>
</svg>
