<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="425" viewBox="0 0 1200 425" role="img" aria-labelledby="title desc">
  <title id="title">Recent development timeline</title>
  <desc id="desc">Generated from public GitHub activity by the repository workflow.</desc>
  <defs>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#141414" stroke-width="1" opacity="0.5" />
    </pattern>
    <style>
      .mono { font-family: 'IBM Plex Mono', 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; }
      .label { fill: #888888; font-size: 12px; letter-spacing: 2px; }
      .micro { fill: #555555; font-size: 10px; letter-spacing: 1.4px; }
      .value { fill: #FFFFFF; font-size: 15px; }
      .soft { fill: #888888; font-size: 13px; }
      .cursor { animation: blink 1.25s steps(1, end) infinite; }
      @keyframes blink { 0%, 47% { opacity: 1; } 48%, 100% { opacity: 0; } }
      @media (prefers-reduced-motion: reduce) { .cursor, .scan { animation: none; } }
    </style>
  </defs>
  <rect x="0.5" y="0.5" width="1199" height="424" fill="#050505" stroke="#333333" />
  <rect x="1" y="1" width="1198" height="423" fill="url(#grid)" />
<text class="mono label" x="48" y="43" >DEVELOPMENT TIMELINE</text>
  <text class="mono micro" x="1152" y="43" text-anchor="end">RECENT PUBLIC PUSH COMMITS</text>
  <line x1="48" y1="65" x2="1152" y2="65" stroke="#333333" opacity="1" />
  <text class="mono label" x="48" y="101" >NOW</text>
  <line x1="82" y1="116" x2="82" y2="379" stroke="#333333" opacity="1" />
  <rect x="77" y="132" width="10" height="10" fill="#A8BAC8" />
